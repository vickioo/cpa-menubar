<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sub2 账号池</title>
  <style>
    :root{font-family:Inter,"Segoe UI",sans-serif;color:#171b20;background:#e9ecef;letter-spacing:0}
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;min-height:100vh}button{font:inherit}
    .panel{width:min(420px,100%);min-height:100vh;margin:auto;padding:14px 13px 22px;background:rgba(249,250,251,.97);box-shadow:0 8px 30px rgba(35,42,50,.14)}
    header{display:flex;align-items:flex-start;gap:8px;padding-bottom:10px;border-bottom:1px solid #d8dde3}
    h1{margin:0;font-size:18px}.sub{margin-top:3px;color:#6a737d;font-size:12px}
    .status{margin-left:auto;display:flex;align-items:center;gap:6px;color:#287148;font-size:12px;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:#39a46a}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 0}
    .metric{padding:9px 10px;background:#fff;border:1px solid #d8dde3;border-radius:6px}.metric span{color:#69727c;font-size:10px}.metric strong{display:block;margin-top:3px;font-size:18px}.healthy{color:#287148}.warn{color:#a86613}
    .toolbar{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #d8dde3;border-bottom:1px solid #d8dde3}
    .tabs{display:flex;border:1px solid #cbd2d9;border-radius:6px;overflow:hidden}.tabs button{padding:6px 13px;border:0;border-right:1px solid #cbd2d9;background:#fff;cursor:pointer}.tabs button:last-child{border:0}.tabs button.active{background:#212a33;color:#fff}
    .sync{margin-left:auto;color:#69727c;font-size:10px}.list{display:grid;gap:5px;padding-top:8px}
    .account{padding:9px 10px;background:#fff;border:1px solid #d8dde3;border-left:3px solid #75808a;border-radius:5px}.account.focus{border-left-color:#c38a18}.account.attention{background:#fffbf2}
    .head,.health,.stats{display:flex;align-items:center;gap:9px}.head{align-items:flex-start}.name{font-weight:700;overflow-wrap:anywhere}.meta{margin-top:3px;color:#69727c;font-size:11px}.state{margin-left:auto;color:#287148;font-size:12px;white-space:nowrap}.state.bad{color:#a86613}
    .meta{max-width:310px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.focus-button{margin-left:auto;width:25px;height:25px;padding:0;border:0;background:transparent;color:#87909a;font-size:18px;cursor:pointer}.focus-button.active{color:#bd8111}.focus-button+.state{margin-left:0}
    .health{margin-top:8px}.health>span{width:48px;font-size:11px}.bar{height:7px;flex:1;overflow:hidden;border-radius:4px;background:#e1e5e8}.fill{height:100%;background:#43a85e}.fill.bad{background:#c18a18}.pct{width:34px;text-align:right;font-size:11px;font-weight:700}
    .stats{margin-top:6px;color:#69727c;font-size:10px}.stats span:last-child{margin-left:auto}.empty{padding:34px 10px;text-align:center;color:#69727c}
    footer{margin-top:14px;color:#747d87;font-size:10px;line-height:1.5}
    @media(max-width:430px){.panel{padding:14px 12px}.metric{padding:10px}.sync{display:none}}
  </style>
</head>
<body>
<main class="panel">
  <header><div><h1>Sub2 账号池</h1><div class="sub">有效账号 · 手动关注 · 只读脱敏</div></div><div class="status" id="status"><span class="dot"></span>连接中</div></header>
  <section class="metrics" id="metrics"></section>
  <section class="toolbar">
    <div class="tabs" aria-label="账号筛选"><button class="active" data-filter="all">全部</button><button data-filter="focus">关注</button><button data-filter="attention">异常</button></div>
    <div class="sync" id="sync">实际数据</div>
  </section>
  <section class="list" id="list"><div class="empty">正在读取 Sub2 数据</div></section>
  <footer>24h 健康度根据实际请求与错误聚合计算。页面不读取或返回 Token、密码、credentials、extra。</footer>
</main>
<script>
  let accounts=[],summary=null,filter="all";
  const focusIDs=new Set(JSON.parse(localStorage.getItem("sub2FocusIDs")||"[]"));
  const metric=(label,value,color="")=>`<div class="metric"><span>${label}</span><strong class="${color}">${value}</strong></div>`;
  function render(){
    const valid=summary?.valid_accounts??accounts.filter(a=>a.valid).length;
    const attention=accounts.filter(a=>(a.recent_errors||0)>0).length;
    const requests=accounts.reduce((sum,a)=>sum+(a.recent_requests||0),0);
    const errors=accounts.reduce((sum,a)=>sum+(a.recent_errors||0),0);
    const success=requests+errors?Math.round(requests/(requests+errors)*100):100;
    document.querySelector("#metrics").innerHTML=metric("24h 请求",requests.toLocaleString())+metric("成功率",`${success}%`,success>=95?"healthy":"warn")+metric("有效账号",valid,"healthy");
    document.querySelector("#sync").textContent=`${accounts.length} 有效 · ${focusIDs.size} 关注`;
    const sorted=[...accounts].sort((a,b)=>(Number(focusIDs.has(b.id))-Number(focusIDs.has(a.id)))||((b.priority||0)-(a.priority||0)));
    const rows=sorted.filter(a=>filter==="all"||(filter==="focus"&&focusIDs.has(a.id))||(filter==="attention"&&(a.recent_errors||0)>0));
    document.querySelector("#list").innerHTML=rows.length?rows.map(a=>{
      const requests=a.recent_requests||0,errors=a.recent_errors||0;
      const health=requests+errors?Math.round(requests/(requests+errors)*100):(a.valid?100:0);
      const focused=focusIDs.has(a.id);
      return `<article class="account ${focused?"focus":""} ${errors?"attention":""}">
        <div class="head"><div><div class="name">${a.display_name||a.email_masked}</div><div class="meta">${(a.plan||a.provider).toUpperCase()} · ${(a.groups||[]).join(" · ")}</div></div><button class="focus-button ${focused?"active":""}" data-focus-id="${a.id}" title="${focused?"取消关注":"设为关注"}" aria-label="${focused?"取消关注":"设为关注"}">${focused?"★":"☆"}</button><div class="state">↻ 可调度</div></div>
        <div class="health"><span>24h 健康</span><div class="bar"><div class="fill ${health<90?"bad":""}" style="width:${health}%"></div></div><div class="pct">${health}%</div></div>
        <div class="stats"><span>请求 ${requests.toLocaleString()} · 错误 ${errors}</span><span>优先级 ${a.priority||0}</span></div>
      </article>`}).join(""):'<div class="empty">没有符合条件的账号</div>';
    document.querySelectorAll("[data-focus-id]").forEach(button=>button.addEventListener("click",()=>{const id=button.dataset.focusId;focusIDs.has(id)?focusIDs.delete(id):focusIDs.add(id);localStorage.setItem("sub2FocusIDs",JSON.stringify([...focusIDs]));render()}));
  }
  document.querySelectorAll("[data-filter]").forEach(button=>button.addEventListener("click",()=>{filter=button.dataset.filter;document.querySelectorAll("[data-filter]").forEach(item=>item.classList.toggle("active",item===button));render()}));
  async function load(){
    try{
      const [s,a]=await Promise.all([fetch("/api/summary"),fetch("/api/accounts")]);
      if(!s.ok||!a.ok)throw new Error();
      summary=await s.json();accounts=(await a.json()).accounts;
      document.querySelector("#status").innerHTML='<span class="dot"></span>Bridge 在线';
      render();
    }catch{document.querySelector("#status").innerHTML='<span class="dot" style="background:#b36b1e"></span>连接失败';document.querySelector("#list").innerHTML='<div class="empty">暂时无法读取 Sub2 数据</div>'}
  }
  load();
</script>
</body>
</html>
